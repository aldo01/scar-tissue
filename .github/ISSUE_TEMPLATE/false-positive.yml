name: False positive
description: scar-tissue reported a finding on code that is actually safe
labels: ["false positive"]
body:
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: timeouts.missing
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Code
      description: The smallest code that reproduces the finding. Remove anything confidential.
      render: text
    validations:
      required: true
  - type: textarea
    id: finding
    attributes:
      label: Finding
      description: The finding as scar-tissue reported it.
    validations:
      required: true
  - type: textarea
    id: why-safe
    attributes:
      label: Why it is safe
      description: The mitigation scar-tissue missed, for example central configuration, a framework default, or a guarantee from the caller.
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent and model
      placeholder: Claude Code with Claude Sonnet, Codex, Cursor
